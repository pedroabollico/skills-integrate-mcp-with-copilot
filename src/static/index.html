<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated Git-style branch lines background -->
    <div class="git-branches">
      <div class="branch-line"></div>
      <div class="branch-line"></div>
      <div class="branch-line"></div>
      <div class="branch-line"></div>
      <div class="branch-line"></div>
      <div class="branch-node"></div>
      <div class="branch-node"></div>
      <div class="branch-node"></div>
      <div class="branch-node"></div>
      <div class="branch-node"></div>
    </div>

    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <!-- School Mascots Section -->
    <section id="mascots-section" style="background-color: #f0fff0; padding: 20px; border-radius: 5px; margin-bottom: 30px; text-align: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
      <h3 style="color: #32cd32; margin-bottom: 20px;">Meet Our Mascots!</h3>
      <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; align-items: center;">
        <div style="text-align: center;">
          <img src="https://octodex.github.com/images/original.png" alt="Original Octocat" style="width: 120px; height: 120px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
          <p style="margin-top: 5px; font-size: 12px; color: #666;">Original Octocat</p>
        </div>
        <div style="text-align: center;">
          <img src="https://octodex.github.com/images/Professortocat_v2.png" alt="Professor Octocat" style="width: 120px; height: 120px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
          <p style="margin-top: 5px; font-size: 12px; color: #666;">Professor Octocat</p>
        </div>
        <div style="text-align: center;">
          <img src="https://octodex.github.com/images/femalecodertocat.png" alt="Female Coder Octocat" style="width: 120px; height: 120px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
          <p style="margin-top: 5px; font-size: 12px; color: #666;">Coder Octocat</p>
        </div>
        <div style="text-align: center;">
          <img src="https://octodex.github.com/images/collabocats.jpg" alt="Collabocats" style="width: 120px; height: 120px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
          <p style="margin-top: 5px; font-size: 12px; color: #666;">Collabocats</p>
        </div>
        <div style="text-align: center;">
          <img src="https://octodex.github.com/images/welcometocat.png" alt="Welcome Octocat" style="width: 120px; height: 120px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
          <p style="margin-top: 5px; font-size: 12px; color: #666;">Welcome Octocat</p>
        </div>
      </div>
    </section>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
